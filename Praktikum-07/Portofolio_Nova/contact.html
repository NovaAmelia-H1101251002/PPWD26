<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak — Nova Amelia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Nova Amelia</a>
        <div class="nav-links">
            <a href="index.html">Beranda</a>
            <a href="about.html">Tentang Saya</a>
            <a href="contact.html" class="active">Kontak</a>
        </div>
    </nav>

    <section style="padding: 60px 20px;">
        <div class="contact-box">
            <h1 class="title-accent text-center" style="font-size: 4rem;">Contact Me</h1>
            <p class="text-center" style="margin-bottom: 20px;">Pesan kamu akan langsung terproses! 💌</p>

        <form id="cute-contact-form">
            <!-- Tambahan settingan otomatis biar gak spam -->
            <input type="hidden" name="_captcha" value="false">
        
            <input type="text" name="nama" placeholder="Nama kamu... " required>
            <input type="email" name="email" placeholder="Email kamu... " required>
            <textarea name="pesan" rows="4" placeholder="Tulis pesan kamu di sini..." required></textarea>
            <button type="submit" class="btn-cute">Kirim Pesan 🕊️</button>
        </form>
        <hr style="border: 0; border-top: 3px dashed var(--pink-light); margin: 30px 0;">
        
        <div class="text-center">
            <p style="margin-bottom: 15px; font-weight: 600;">Atau hubungi aku langsung lewat:</p>
            <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <a href="mailto:novaamelia2970@gmail.com"
                    style="display: inline-block; padding: 10px 20px; border: 2px solid var(--green); color: var(--green); border-radius: 15px; text-decoration: none; font-weight: 700; background: white; transition: 0.3s;">
                    💌 Email
                </a>
            </div>

            <div id="success-message" class="hidden success-box">
                <h3 style="font-family: var(--font-script); font-size: 2.5rem;">Pesan Kamu Sudah Terkirim! 🌺</h3>
                <p>Terima kasih sudah menghubungi Nova. Have a lovely day! ✨</p>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
